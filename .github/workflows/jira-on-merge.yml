name: jira-on-merge
on:
  push:
    branches: [main]

jobs:
  jira:
    runs-on: ubuntu-latest
    environment: autofix-publish
    env:
      MSG: ${{ github.event.head_commit.message }}
      JIRA_BASE: https://lejinkr.atlassian.net
      JIRA_AUTH: ${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}
      DONE_ID: "31"
    steps:
      - name: Update Jira
        run: |
          case "$MSG" in *"automated bug fix"*) ;; *) echo "Not an autofix commit"; exit 0;; esac
          KEY=$(printf '%s' "$MSG" | head -1 | grep -oE '^[A-Z][A-Z0-9]+-[0-9]+' || true)
          if [ -z "$KEY" ]; then echo "No Jira key"; exit 0; fi
          URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          curl -sf -u "$JIRA_AUTH" -X POST -H "Content-Type: application/json" \
            "$JIRA_BASE/rest/api/2/issue/$KEY/comment" \
            -d "{\"body\":\"Fixed and merged: $URL\"}"
          curl -sf -u "$JIRA_AUTH" -X POST -H "Content-Type: application/json" \
            "$JIRA_BASE/rest/api/2/issue/$KEY/transitions" \
            -d "{\"transition\":{\"id\":\"$DONE_ID\"}}"
